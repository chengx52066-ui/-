<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✨ 手势控制粒子系统</title>
<style>
  :root {
    --bg: #0a0a14;
    --panel-bg: rgba(20, 20, 40, 0.85);
    --border: rgba(255, 255, 255, 0.1);
    --text: #e8e8f0;
    --text2: #a0a0b8;
    --accent: #a855f7;
    --active: #e040a0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    font-family: 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    user-select: none;
    -webkit-user-select: none;
  }

  canvas#particleCanvas {
    position: fixed;
    inset: 0;
    display: block;
  }

  /* 摄像头预览 */
  #cameraPreview {
    position: fixed;
    bottom: 16px;
    right: 16px;
    width: 160px;
    height: 120px;
    border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.2);
    object-fit: cover;
    transform: scaleX(-1);
    opacity: 0.7;
    z-index: 10;
    transition: opacity 0.3s;
  }
  #cameraPreview:hover { opacity: 1; }

  /* 顶部控制栏 */
  .control-bar {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    padding: 8px 16px;
    background: var(--panel-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--border);
    border-radius: 40px;
    z-index: 20;
    align-items: center;
  }

  .shape-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 2px solid transparent;
    background: rgba(255,255,255,0.05);
    color: var(--text2);
    font-size: 20px;
    cursor: pointer;
    transition: all 0.25s;
    display: flex;
    align-items: center;
    justify-content: center;
    outline: none;
  }
  .shape-btn:hover {
    background: rgba(255,255,255,0.12);
    color: #fff;
    border-color: rgba(255,255,255,0.3);
  }
  .shape-btn.active {
    background: rgba(168,85,247,0.25);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 0 20px rgba(168,85,247,0.3);
  }

  .divider {
    width: 1px;
    height: 24px;
    background: var(--border);
    margin: 0 4px;
  }

  #colorPicker {
    -webkit-appearance: none;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 2px solid var(--border);
    cursor: pointer;
    background: transparent;
    padding: 2px;
  }
  #colorPicker::-webkit-color-swatch-wrapper { padding: 0; }
  #colorPicker::-webkit-color-swatch { border-radius: 50%; border: none; }

  .icon-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.05);
    color: var(--text);
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    outline: none;
  }
  .icon-btn:hover { background: rgba(255,255,255,0.15); }

  /* 状态指示器 */
  .status-bar {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 16px;
    padding: 8px 20px;
    background: var(--panel-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--border);
    border-radius: 24px;
    z-index: 20;
    font-size: 12px;
    color: var(--text2);
  }
  .status-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    transition: background 0.3s;
  }
  .status-dot.active { background: #2ecc71; box-shadow: 0 0 8px #2ecc71; }
  .status-dot.inactive { background: #e74c3c; }

  .status-value {
    color: #fff;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    font-family: 'SF Mono', 'Consolas', monospace;
  }

  /* 响应式 */
  @media (max-width: 640px) {
    .control-bar { gap: 4px; padding: 6px 12px; }
    .shape-btn { width: 34px; height: 34px; font-size: 16px; }
    #cameraPreview { width: 100px; height: 75px; bottom: 8px; right: 8px; }
  }
</style>
</head>
<body>

<canvas id="particleCanvas"></canvas>
<video id="cameraPreview" autoplay playsinline muted></video>

<!-- 形状选择栏 -->
<div class="control-bar">
  <button class="shape-btn active" data-shape="heart" title="爱心">❤️</button>
  <button class="shape-btn" data-shape="flower" title="花朵">🌸</button>
  <button class="shape-btn" data-shape="saturn" title="土星">🪐</button>
  <button class="shape-btn" data-shape="firework" title="烟花">🎆</button>
  <span class="divider"></span>
  <input type="color" id="colorPicker" value="#ff4488" title="粒子颜色">
  <span class="divider"></span>
  <button class="icon-btn" id="btnFullscreen" title="全屏">⛶</button>
</div>

<!-- 底部状态栏 -->
<div class="status-bar">
  <div class="status-item">
    <div class="status-dot inactive" id="gestureDot"></div>
    <span>手势</span>
    <span class="status-value" id="gestureLabel">等待中</span>
  </div>
  <div class="status-item">
    <span>🔍 缩放</span>
    <span class="status-value" id="zoomLabel">1.0x</span>
  </div>
  <div class="status-item">
    <span>🔄 旋转</span>
    <span class="status-value" id="rotateLabel">0°</span>
  </div>
</div>

<!-- MediaPipe Hands -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js"
  crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"
  crossorigin="anonymous"></script>

<script>
// ============================================================
// DOM 引用
// ============================================================
const canvas = document.getElementById('particleCanvas');
const ctx = canvas.getContext('2d');
const video = document.getElementById('cameraPreview');
const colorPicker = document.getElementById('colorPicker');
const btnFullscreen = document.getElementById('btnFullscreen');

// ============================================================
// Canvas 尺寸
// ============================================================
function resizeCanvas() {
  canvas.width = window.innerWidth * devicePixelRatio;
  canvas.height = window.innerHeight * devicePixelRatio;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale(devicePixelRatio, devicePixelRatio);
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

const W = () => window.innerWidth;
const H = () => window.innerHeight;

// ============================================================
// 手势状态（平滑处理）
// ============================================================
const gesture = {
  openness: 0,         // 0(握拳) ~ 1(全张开)
  rotation: 0,         // 手部旋转角度 (弧度)
  detected: false,
  // 平滑目标值
  targetOpenness: 0.5,
  targetRotation: 0,
  smoothOpenness: 0.5,
  smoothRotation: 0,
};

// ============================================================
// 粒子系统配置
// ============================================================
const config = {
  shape: 'heart',          // heart | flower | saturn | firework
  color: '#ff4488',
  particleCount: 600,
  zoom: 1.0,
  rotation: 0,
};

// ============================================================
// 粒子数组
// ============================================================
let particles = [];
let targetPositions = []; // 目标位置（归一化坐标 -0.5~0.5）

// ============================================================
// 形状生成器：返回归一化坐标数组 [-0.5, 0.5]
// ============================================================
function generateHeartPoints(count) {
  const pts = [];
  for (let i = 0; i < count; i++) {
    const t = (i / count) * Math.PI * 2;
    // Parametric heart curve
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    pts.push({ x: x / 32, y: -y / 32 }); // normalize to ~[-0.5, 0.5]
  }
  // 填充内部点
  const innerCount = Math.floor(count * 0.3);
  for (let i = 0; i < innerCount; i++) {
    const r = Math.random() * 0.8;
    const a = Math.random() * Math.PI * 2;
    const t = a;
    const hx = 16 * Math.pow(Math.sin(t), 3) / 32;
    const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) / 32;
    pts.push({ x: hx * r, y: hy * r });
  }
  return pts;
}

function generateFlowerPoints(count) {
  const pts = [];
  const petals = 6;
  for (let i = 0; i < count; i++) {
    const t = (i / count) * Math.PI * 2;
    // Rose curve: r = cos(k*θ)
    const r = Math.cos(petals * t) * 0.42;
    const x = r * Math.cos(t);
    const y = r * Math.sin(t);
    // 添加变化
    const jitter = 0.02 * (Math.random() - 0.5);
    pts.push({ x: x + jitter, y: y + jitter });
  }
  // 花蕊
  const centerCount = Math.floor(count * 0.15);
  for (let i = 0; i < centerCount; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = Math.random() * 0.08;
    pts.push({ x: Math.cos(a) * r, y: Math.sin(a) * r });
  }
  return pts;
}

function generateSaturnPoints(count) {
  const pts = [];
  // 行星主体
  const bodyCount = Math.floor(count * 0.4);
  for (let i = 0; i < bodyCount; i++) {
    // 球体投影（3D -> 2D）
    const phi = Math.acos(2 * Math.random() - 1);
    const theta = Math.random() * Math.PI * 2;
    const r = 0.18;
    const x = r * Math.sin(phi) * Math.cos(theta);
    const y = r * Math.sin(phi) * Math.sin(theta);
    // 添加光照效果（上半球更亮 → 通过颜色实现）
    const shade = 0.6 + 0.4 * (Math.sin(phi) * Math.cos(theta) * 0.5 + 0.5);
    pts.push({ x, y, shade });
  }
  // 光环
  const ringCount = Math.floor(count * 0.55);
  for (let i = 0; i < ringCount; i++) {
    const angle = (i / ringCount) * Math.PI * 2;
    const r = 0.25 + Math.random() * 0.12;
    // 椭圆环（透视效果）
    const x = Math.cos(angle) * r;
    const y = Math.sin(angle) * r * 0.25;
    const shade = 1.0;
    pts.push({ x, y, shade });
  }
  // 间隙（卡西尼缝）
  const gapCount = Math.floor(count * 0.05);
  const gapR = 0.275;
  for (let i = 0; i < gapCount; i++) {
    const angle = Math.random() * Math.PI * 2;
    const x = Math.cos(angle) * gapR;
    const y = Math.sin(angle) * gapR * 0.25;
    pts.push({ x, y, gap: true });
  }
  return pts;
}

function generateFireworkPoints(count) {
  const pts = [];
  // 中心爆发点
  const burstCount = Math.floor(count * 0.7);
  const numStreams = 12 + Math.floor(Math.random() * 8);
  for (let i = 0; i < burstCount; i++) {
    const streamIdx = i % numStreams;
    const baseAngle = (streamIdx / numStreams) * Math.PI * 2 + (Math.random() - 0.5) * 0.3;
    const dist = Math.pow(Math.random(), 0.6) * 0.45;
    const x = Math.cos(baseAngle) * dist;
    const y = Math.sin(baseAngle) * dist;
    pts.push({ x, y, dist });
  }
  // 散落光点
  const sparkCount = Math.floor(count * 0.3);
  for (let i = 0; i < sparkCount; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = 0.15 + Math.random() * 0.35;
    pts.push({ x: Math.cos(a) * r, y: Math.sin(a) * r, spark: true });
  }
  return pts;
}

function generateShapePoints(shape, count) {
  switch (shape) {
    case 'heart': return generateHeartPoints(count);
    case 'flower': return generateFlowerPoints(count);
    case 'saturn': return generateSaturnPoints(count);
    case 'firework': return generateFireworkPoints(count);
    default: return generateHeartPoints(count);
  }
}

// ============================================================
// 初始化粒子
// ============================================================
function initParticles() {
  targetPositions = generateShapePoints(config.shape, config.particleCount);
  particles = targetPositions.map((tp, i) => ({
    x: (Math.random() - 0.5) * 0.8,
    y: (Math.random() - 0.5) * 0.8,
    targetX: tp.x,
    targetY: tp.y,
    baseTargetX: tp.x,
    baseTargetY: tp.y,
    size: 1.2 + Math.random() * 2.8,
    alpha: 0.6 + Math.random() * 0.4,
    hueShift: (Math.random() - 0.5) * 30,
    speed: 0.03 + Math.random() * 0.07,
    spark: tp.spark || false,
    gap: tp.gap || false,
    dist: tp.dist || 0,
  }));
}

// ============================================================
// 更新目标位置（根据 zoom 和 rotation）
// ============================================================
function updateTargetPositions() {
  const zoom = config.zoom;
  const rotation = config.rotation;
  const cos = Math.cos(rotation);
  const sin = Math.sin(rotation);

  particles.forEach(p => {
    let tx = p.baseTargetX;
    let ty = p.baseTargetY;

    // 缩放
    tx *= zoom;
    ty *= zoom;

    // 旋转
    const rx = tx * cos - ty * sin;
    const ry = tx * sin + ty * cos;

    p.targetX = rx;
    p.targetY = ry;
  });
}

// ============================================================
// 更新粒子
// ============================================================
function updateParticles() {
  updateTargetPositions();

  const cx = W() / 2;
  const cy = H() / 2;
  const scale = Math.min(W(), H()) * 0.9;

  particles.forEach(p => {
    const tx = cx + p.targetX * scale;
    const ty = cy + p.targetY * scale;

    // lerp toward target
    p.x += (tx - p.x) * p.speed;
    p.y += (ty - p.y) * p.speed;
  });
}

// ============================================================
// 绘制粒子
// ============================================================
function hexToRgb(hex) {
  const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  return result ? {
    r: parseInt(result[1], 16),
    g: parseInt(result[2], 16),
    b: parseInt(result[3], 16)
  } : { r: 255, g: 68, b: 136 };
}

function drawParticles() {
  ctx.clearRect(0, 0, W(), H());

  // 外层暗色背景光晕
  const gradient = ctx.createRadialGradient(W() / 2, H() / 2, 0, W() / 2, H() / 2, Math.min(W(), H()) * 0.7);
  gradient.addColorStop(0, 'rgba(10,10,30,0)');
  gradient.addColorStop(1, 'rgba(0,0,0,0.4)');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, W(), H());

  const baseColor = hexToRgb(config.color);

  // 按深度排序（土星环需要正确遮挡）
  if (config.shape === 'saturn') {
    particles.sort((a, b) => a.baseTargetY - b.baseTargetY);
  }

  // 烟花特殊动画
  const time = performance.now() / 1000;

  particles.forEach(p => {
    if (p.gap && config.shape === 'saturn') return; // 跳过环缝

    let alpha = p.alpha;
    let size = p.size;

    // 烟花：外围粒子闪烁
    if (config.shape === 'firework' && p.spark) {
      alpha = 0.3 + 0.7 * Math.abs(Math.sin(time * 3 + p.dist * 20));
      size = p.size * (0.6 + 0.4 * Math.sin(time * 4 + p.dist * 15));
    }

    // 烟花：根据距离衰减
    if (config.shape === 'firework' && p.dist !== undefined) {
      alpha *= 0.7 + 0.3 * (1 - p.dist / 0.45);
    }

    const hueShift = config.shape === 'firework'
      ? p.hueShift + Math.sin(time * 2 + p.dist * 10) * 20
      : p.hueShift;

    // 计算颜色
    let r = baseColor.r;
    let g = baseColor.g;
    let b = baseColor.b;

    // 色相偏移（通过调整 RGB）
    if (hueShift > 0) {
      r = Math.min(255, r + hueShift * 0.8);
      g = Math.min(255, g + hueShift * 0.3);
    } else {
      b = Math.min(255, b - hueShift * 0.8);
      r = Math.max(0, r + hueShift * 0.5);
    }

    // 绘制光点
    const glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, size * 2.5);
    glow.addColorStop(0, `rgba(${Math.min(255, r + 60)},${Math.min(255, g + 60)},${Math.min(255, b + 60)},${alpha})`);
    glow.addColorStop(0.4, `rgba(${r},${g},${b},${alpha * 0.7})`);
    glow.addColorStop(1, `rgba(${r},${g},${b},0)`);

    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(p.x, p.y, size * 2.5, 0, Math.PI * 2);
    ctx.fill();

    // 核心亮点
    ctx.fillStyle = `rgba(255,255,255,${alpha * 0.8})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, size * 0.35, 0, Math.PI * 2);
    ctx.fill();
  });
}

// ============================================================
// 形状切换
// ============================================================
function changeShape(shape) {
  if (config.shape === shape) return;
  config.shape = shape;
  targetPositions = generateShapePoints(shape, config.particleCount);

  // 更新粒子目标和基础目标
  particles.forEach((p, i) => {
    if (i < targetPositions.length) {
      p.baseTargetX = targetPositions[i].x;
      p.baseTargetY = targetPositions[i].y;
      p.spark = targetPositions[i].spark || false;
      p.gap = targetPositions[i].gap || false;
      p.dist = targetPositions[i].dist || 0;
      p.speed = 0.03 + Math.random() * 0.07; // 重置速度获得流畅过渡
    }
  });

  // 如果粒子不够，补充
  while (particles.length < targetPositions.length) {
    const tp = targetPositions[particles.length];
    particles.push({
      x: (Math.random() - 0.5) * 0.4,
      y: (Math.random() - 0.5) * 0.4,
      targetX: tp.x, targetY: tp.y,
      baseTargetX: tp.x, baseTargetY: tp.y,
      size: 1.2 + Math.random() * 2.8,
      alpha: 0.6 + Math.random() * 0.4,
      hueShift: (Math.random() - 0.5) * 30,
      speed: 0.03 + Math.random() * 0.07,
      spark: tp.spark || false,
      gap: tp.gap || false,
      dist: tp.dist || 0,
    });
  }
}

// ============================================================
// 形状按钮事件
// ============================================================
document.querySelectorAll('.shape-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.shape-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    changeShape(btn.dataset.shape);
  });
});

// ============================================================
// 颜色选择器
// ============================================================
colorPicker.addEventListener('input', (e) => {
  config.color = e.target.value;
});

// ============================================================
// 全屏控制
// ============================================================
btnFullscreen.addEventListener('click', () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
    btnFullscreen.textContent = '⛶';
  } else {
    document.exitFullscreen();
    btnFullscreen.textContent = '⛶';
  }
});
document.addEventListener('fullscreenchange', () => {
  btnFullscreen.textContent = document.fullscreenElement ? '⛶' : '⛶';
});

// ============================================================
// 摄像头 + MediaPipe 手势识别
// ============================================================
let hands = null;
let cameraReady = false;

async function setupCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: 640, height: 480, facingMode: 'user' }
    });
    video.srcObject = stream;
    await video.play();
    return true;
  } catch (e) {
    console.warn('摄像头不可用，使用鼠标模拟手势:', e.message);
    return false;
  }
}

function setupMediaPipe() {
  if (typeof Hands === 'undefined') {
    console.warn('MediaPipe 未加载，使用鼠标模拟');
    return false;
  }

  hands = new Hands({
    locateFile: (file) =>
      `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${file}`
  });

  hands.setOptions({
    maxNumHands: 1,
    modelComplexity: 1,
    minDetectionConfidence: 0.7,
    minTrackingConfidence: 0.6,
  });

  hands.onResults(onHandResults);

  return true;
}

function onHandResults(results) {
  if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
    const lm = results.multiHandLandmarks[0];
    gesture.detected = true;

    // 计算手掌张合度：五指指尖到手腕的平均距离
    const wrist = lm[0];
    const tips = [4, 8, 12, 16, 20]; // thumb, index, middle, ring, pinky tips
    let totalDist = 0;
    tips.forEach(tipIdx => {
      const dx = lm[tipIdx].x - wrist.x;
      const dy = lm[tipIdx].y - wrist.y;
      totalDist += Math.sqrt(dx * dx + dy * dy);
    });
    // 归一化：握拳约 0.3~0.5，全张开约 1.2~1.6
    const raw = (totalDist - 0.3) / 1.3;
    gesture.targetOpenness = Math.max(0, Math.min(1, raw));

    // 计算手部旋转角度
    const middleMcp = lm[9]; // middle finger MCP
    const dx = middleMcp.x - wrist.x;
    const dy = middleMcp.y - wrist.y;
    // 限制在 -60° ~ 60° (约 -1.05 ~ 1.05 弧度)
    gesture.targetRotation = Math.max(-1.05, Math.min(1.05, Math.atan2(dx, -dy)));

    // 更新手势状态 UI
    const openness = gesture.targetOpenness;
    let gestureName = '🖐 张开';
    if (openness < 0.2) gestureName = '✊ 握拳';
    else if (openness < 0.5) gestureName = '🤏 半握';
    else if (openness < 0.8) gestureName = '✋ 微张';
    document.getElementById('gestureLabel').textContent = gestureName;
    document.getElementById('gestureDot').classList.add('active');
    document.getElementById('gestureDot').classList.remove('inactive');

  } else {
    gesture.detected = false;
    document.getElementById('gestureLabel').textContent = '未检测';
    document.getElementById('gestureDot').classList.add('inactive');
    document.getElementById('gestureDot').classList.remove('active');
  }
}

async function startCameraLoop() {
  if (!hands) return;
  try {
    await hands.send({ image: video });
  } catch (e) {
    console.warn('MediaPipe 处理错误:', e.message);
  }
  if (cameraReady) {
    requestAnimationFrame(() => startCameraLoop());
  }
}

// ============================================================
// 鼠标/触摸模拟手势（摄像头不可用时）
// ============================================================
let mouseActive = false;
let mouseX = 0, mouseY = 0;

canvas.addEventListener('pointerdown', (e) => {
  mouseActive = true;
  mouseX = e.clientX;
  mouseY = e.clientY;
});
canvas.addEventListener('pointermove', (e) => {
  if (!mouseActive) return;
  mouseX = e.clientX;
  mouseY = e.clientY;
});
canvas.addEventListener('pointerup', () => { mouseActive = false; });
canvas.addEventListener('pointerleave', () => { mouseActive = false; });

function applyMouseGesture() {
  if (!mouseActive) {
    // 缓慢回中
    gesture.targetOpenness += (0.7 - gesture.targetOpenness) * 0.02;
    gesture.targetRotation += (0 - gesture.targetRotation) * 0.02;
    if (!cameraReady) {
      document.getElementById('gestureLabel').textContent = '🖱 鼠标控制';
      document.getElementById('gestureDot').classList.add('active');
      document.getElementById('gestureDot').classList.remove('inactive');
    }
    return;
  }
  if (cameraReady) return; // 摄像头优先

  const cx = W() / 2;
  const cy = H() / 2;
  // 纵向位置控制缩放（上=张开=放大，下=握拳=缩小）
  const openness = 1 - (mouseY / H());
  gesture.targetOpenness = Math.max(0, Math.min(1, openness));
  // 横向位置控制旋转
  gesture.targetRotation = ((mouseX / W()) - 0.5) * 2 * 1.05; // -1.05 ~ 1.05

  document.getElementById('gestureLabel').textContent = '🖱 鼠标';
  document.getElementById('gestureDot').classList.add('active');
  document.getElementById('gestureDot').classList.remove('inactive');
}

// ============================================================
// 平滑更新手势 → 粒子参数
// ============================================================
function applyGestureToConfig() {
  // 指数平滑
  const smoothing = 0.12;
  gesture.smoothOpenness += (gesture.targetOpenness - gesture.smoothOpenness) * smoothing;
  gesture.smoothRotation += (gesture.targetRotation - gesture.smoothRotation) * smoothing;

  // 映射到手部张合 → 缩放 (0.4x ~ 3.5x)
  config.zoom = 0.4 + gesture.smoothOpenness * 3.1;
  // 映射到旋转角度
  config.rotation = gesture.smoothRotation;

  // 更新状态栏
  document.getElementById('zoomLabel').textContent = config.zoom.toFixed(1) + 'x';
  const deg = Math.round(config.rotation * (180 / Math.PI));
  document.getElementById('rotateLabel').textContent = deg + '°';
}

// ============================================================
// 主循环
// ============================================================
function animate() {
  applyMouseGesture();
  applyGestureToConfig();
  updateParticles();
  drawParticles();
  requestAnimationFrame(animate);
}

// ============================================================
// 启动
// ============================================================
async function init() {
  initParticles();

  cameraReady = await setupCamera();
  if (cameraReady) {
    const mpReady = setupMediaPipe();
    if (mpReady) {
      // 等待 MediaPipe 加载模型
      await new Promise(resolve => setTimeout(resolve, 1500));
      startCameraLoop();
    }
  }

  if (!cameraReady) {
    document.getElementById('gestureLabel').textContent = '🖱 鼠标';
    document.getElementById('gestureDot').classList.add('active');
    document.getElementById('gestureDot').classList.remove('inactive');
  }

  animate();
}

// 处理 MediaPipe 加载失败
window.addEventListener('error', (e) => {
  if (e.target.tagName === 'SCRIPT' && e.target.src.includes('mediapipe')) {
    console.warn('MediaPipe CDN 加载失败，使用鼠标控制');
    document.getElementById('gestureLabel').textContent = '🖱 鼠标';
    document.getElementById('gestureDot').classList.add('active');
    document.getElementById('gestureDot').classList.remove('inactive');
  }
}, true);

init();
</script>
